# Uforge (You Forge)
# The Runtime is the `web` service: code in services/web, URL http://localhost:5173
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hforge}
      POSTGRES_DB: ${POSTGRES_DB:-hforge}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hforge} -d ${POSTGRES_DB:-hforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [hforge]

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [hforge]

  gateway:
    # Accounts, quotas, AI turns. Stateless about apps (doc/features/gateway.md).
    build:
      context: ./services/gateway
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hforge}:${POSTGRES_PASSWORD:-hforge}@postgres:5432/${POSTGRES_DB:-hforge}?schema=public
      REDIS_URL: redis://redis:6379
      HFORGE_SKILLS_DIR: /skills/prompt
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    volumes:
      - ./skills/prompt:/skills/prompt
      - ./services/gateway/src:/app/src
      - ./services/gateway/prisma:/app/prisma
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [hforge]

  compiler:
    # esbuild, stateless; npm packages cached in /cache (doc/features/compiler.md).
    build:
      context: ./services/compiler
    environment:
      COMPILER_PORT: 3001
      COMPILER_CACHE_DIR: /cache
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    volumes:
      - ./services/compiler/src:/app/src
      - compiler_cache:/cache
    ports:
      - "3001:3001"
    networks: [hforge]

  web:
    # Uforge Runtime (Vue 3 + Vite). Open http://localhost:5173
    build:
      context: ./services/web
    environment:
      VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://localhost:3000}
      VITE_COMPILER_URL: ${VITE_COMPILER_URL:-http://localhost:3001}
    volumes:
      - ./services/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - gateway
      - compiler
    networks: [hforge]

volumes:
  pgdata:
  redisdata:
  compiler_cache:
  web_node_modules:

networks:
  hforge:
    name: hforge
